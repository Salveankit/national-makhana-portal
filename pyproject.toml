[project]
name = "national-makhana-portal"
version = "0.1.0"
description = "Sprint 1 scaffold for the National Makhana Board portal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.137.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
app = "backend.app.main:app"

[tool.uv]
package = false

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  ".pytest_cache",
  "pytest-cache-files-*",
]
